events:
  Scenario:
    actions:
      - set_variable scenario_choice:xero_campaign
    conditions:
      - not variable_set scenario_choice
    type: event

  Character Select:
    actions:
      - jji_character_select
    conditions:
      - is variable_set scenario_choice:xero_campaign
      - not variable_set jji_character_index
    type: event

  Xero:
    actions:
      - change_bg start_menu_bg
      - transition_teleport player,player_house_bedroom.tmx,4,4,0.3
    conditions:
      - is variable_set scenario_choice:xero_campaign
      - is variable_set jji_character_index
    type: event
